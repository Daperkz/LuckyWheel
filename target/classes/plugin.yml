name: LuckyWheelCustom
version: '1.1.0'
main: com.daperkz.luckywheel.Main
api-version: 1.20
author: Daperkz
description: fully customizable lucky wheel plugin

permissions:
  Daperkz.luckywheel:
    description: Permission d'utiliser /luckywheel
    default: true
  Daperkz.luckywheel.admin:
    description: Permission de recharger le plugin et /give
    default: op

commands:
  luckywheel:
    description: "Commande principale de LuckyWheel"
    permission: Daperkz.luckywheel
    permission-message: "<red>Tu n'as pas la permission d'utiliser cette commande."
    usage: "/luckywheel <spin|give|reload> [arguments...]"
    aliases: [lw]
