name: LuckyWheel CI/CD

on:
  push:
    branches-ignore:
      - 'no-ga/**'
    tags:
      - 'v*.*.*'
      - 'v*.*'
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - 'no-ga/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_and_check:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Java JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Compile Project
        run: make jar
        timeout-minutes: 5

      - name: Verify Build Output
        run: |
          if ! compgen -G "build/libs/LuckyWheel-*.jar" > /dev/null; then
            echo "::error::Built JAR files not found in build/libs/ directory!"
            exit 1
          fi

      - name: Upload Build Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: LuckyWheel-build-${{ github.sha }}
          path: build/libs/LuckyWheel-*.jar
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build_and_check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Java JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build Release JAR
        run: make jar
        timeout-minutes: 5

      - name: Create GitHub Release & Upload JAR
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/LuckyWheel-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
